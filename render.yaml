services:
  - type: web
    name: cropmind
    env: python
    buildCommand: |
      python --version
      python -m ensurepip --upgrade
      python -m pip install --upgrade pip setuptools wheel
      chmod +x build.sh && ./build.sh
    startCommand: gunicorn backend.app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: PYTHONPATH
        value: /opt/render/project/src/backend
      - key: PORT
        value: 10000
    plan: free