services:
  # Backend Service
  - type: web
    name: cropmind-backend
    runtime: python
    buildCommand: |
      chmod +x setup.sh
      ./setup.sh
    startCommand: gunicorn --bind :$PORT backend.app:app
    envVars:
      - key: FLASK_APP
        value: "backend/app.py"
      - key: FLASK_ENV
        value: "production"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHON_VERSION
        value: "3.10.0"
      - key: OPENWEATHER_API_KEY
        sync: false

  # Frontend Service
  - type: web
    name: cropmind-frontend
    env: static
    buildCommand: |
      cd frontend
      npm install
      npm run build
    staticPublishPath: "./frontend/build"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: REACT_APP_API_URL
        sync: false  # Set this to backend URL after deployment
    plan: free