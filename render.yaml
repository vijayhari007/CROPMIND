services:
  - type: web
    name: cropmind
    env: python
    python:
      version: 3.10.0
    buildCommand: |
      echo "Setting up Python 3.10.0 environment..."
      python3.10 --version
      python3.10 -m ensurepip --upgrade
      python3.10 -m pip install --upgrade pip==23.0.1 setuptools wheel
      chmod +x build.sh && ./build.sh
    # Remove startCommand to use Procfile
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: PYTHONPATH
        value: /opt/render/project/src/backend
      - key: PORT
        value: 10000