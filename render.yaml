services:
  # Backend Service
  - type: web
    name: cropmind-backend
    envVars:
      - key: FLASK_APP
        value: "backend/app.py"
      - key: FLASK_ENV
        value: "production"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: OPENWEATHER_API_KEY
        sync: false  # Set this in Render dashboard
    buildCommand: |
      pip install -r requirements.txt
      pip install gunicorn
    startCommand: gunicorn --bind :$PORT backend.app:app
    env: python
    plan: free

  # Frontend Service
  - type: web
    name: cropmind-frontend
    env: static
    buildCommand: |
      cd frontend
      npm install
      npm run build
    staticPublishPath: "./frontend/build"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: REACT_APP_API_URL
        sync: false  # Set this to backend URL after deployment
      - key: NODE_VERSION
        value: "18.16.0"
    plan: free