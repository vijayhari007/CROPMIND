services:
  - type: web
    name: cropmind-backend
    env: python
    buildCommand: |
      pip install -r requirements.txt
      pip install .
    startCommand: gunicorn --bind :$PORT backend.app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.9.0"
      - key: FLASK_ENV
        value: production
      - key: OPENWEATHER_API_KEY
        sync: false
    plan: free
  - type: web
    name: cropmind-frontend
    env: static
    buildCommand: |
      cd frontend
      npm install
      npm run build
    staticPublishPath: "./frontend/build"
    envVars:
      - key: REACT_APP_API_URL
        sync: false
    plan: free