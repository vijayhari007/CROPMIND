services:
  - type: web
    name: cropmind
    env: python
    python:
      version: 3.10.0
    buildCommand: |
      python --version
      python -m ensurepip --upgrade
      python -m pip install --upgrade pip==23.0.1 setuptools wheel
      chmod +x build.sh && ./build.sh
    startCommand: gunicorn --timeout 120 --workers 1 --threads 4 --worker-class gthread backend.app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: PYTHONPATH
        value: /opt/render/project/src/backend
      - key: PORT
        value: 10000