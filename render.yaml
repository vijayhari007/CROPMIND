services:
  - type: web
    name: cropmind
    env: python
    python:
      version: 3.10.0
    buildCommand: |
      echo "Setting up Python environment..."
      python --version
      chmod +x build.sh && ./build.sh
    startCommand: /opt/render/project/venv/bin/python -m gunicorn -c gunicorn_config.py backend.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: PORT
        value: 10000
      - key: PATH
        value: /opt/render/project/venv/bin:$PATH