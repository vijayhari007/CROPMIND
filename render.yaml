services:
  - type: web
    name: cropmind
    env: python
    python:
      version: 3.10.0
    buildCommand: |
      echo "Setting up Python environment..."
      python --version
      python -m ensurepip --upgrade
      python -m pip install --upgrade pip==23.0.1 setuptools wheel
      chmod +x build.sh && ./build.sh
    startCommand: python -m gunicorn -c gunicorn_config.py backend.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: PORT
        value: 10000
      - key: PATH
        value: /opt/render/project/venv/bin:$PATH