services:
  - type: web
    name: cropmind
    env: python
    region: oregon  # Change to your preferred region
    buildCommand: |
      pip install -r requirements.txt
      cd frontend && npm install && npm run build
      cd ..
    startCommand: gunicorn backend.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: NODE_VERSION
        value: 16.x
      - key: PORT
        value: 10000
      - key: FLASK_ENV
        value: production
