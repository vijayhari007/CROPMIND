services:
  - type: web
    name: cropmind
    env: python
    buildCommand: |
      echo "Setting up Python environment..."
      python --version
      python -m ensurepip --upgrade
      python -m pip install --upgrade pip
      chmod +x build.sh && ./build.sh
    startCommand: |
      source /opt/render/project/venv/bin/activate
      gunicorn -c gunicorn_config.py backend.app:app
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: PORT
        value: 10000
      - key: PATH
        value: /opt/render/project/venv/bin:$PATH
      - key: PYTHONHOME
        value: /opt/render/project/venv