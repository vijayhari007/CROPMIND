services:
  - type: web
    name: cropmind-backend
    env: python
    buildCommand: |
      pip install -e .
    startCommand: gunicorn --bind :$PORT backend.app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.9.0"
      - key: FLASK_ENV
        value: production
      - key: OPENWEATHER_API_KEY
        sync: false
    plan: free
  # Frontend Service
  - type: web
    name: cropmind-frontend
    env: static
    buildCommand: |
      cd frontend
      npm install
      npm run build
    staticPublishPath: "./frontend/build"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: REACT_APP_API_URL
        sync: false  # Set this to backend URL after deployment
    plan: free